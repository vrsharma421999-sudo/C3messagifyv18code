<template>
    <div class="slds-card slds-m-around_medium">
        <div class="slds-page-header">
            <div class="slds-page-header__row">
                <div class="slds-page-header__col-title">
                    <div class="slds-media">
                        <div class="slds-media__figure">
                            <lightning-icon icon-name="standard:messaging_conversation" size="medium"></lightning-icon>
                        </div>
                        <div class="slds-media__body">
                            <div class="slds-page-header__name">
                                <div class="slds-page-header__name-title">
                                    <h1>
                                        <span class="slds-page-header__title slds-truncate" title="Send Bulk Template">Send Bulk Template</span>
                                    </h1>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="slds-page-header__row slds-page-header__row_gutters">
                <div class="slds-page-header__col-details">
                    <ul class="slds-list_dotted slds-text-color_weak slds-m-top_small">
                        <li>Ensure <strong>WhatsApp Number Configuration</strong> is set up for the object.</li>
                        <li>Create a <strong>Field Set</strong> with name <strong>C3WAFieldSet</strong> for the object to define the columns displayed in the table.</li>
                        <li>There must be a <strong>Template</strong> configured to send messages for the object.</li>
                    </ul>
                </div>
            </div>
        </div>

        <div class="slds-card__body slds-card__body_inner slds-m-top_medium">
            <div class="slds-form-element slds-m-bottom_large">
                <div class="slds-grid slds-grid_vertical-align-end">
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                        <lightning-combobox
                            name="templateObject"
                            label="Select Object"
                            required
                            field-level-help="Select Object on which you wish to send the template."
                            options={objectOptions}
                            value={selectedObject}
                            onchange={genericChange}>
                        </lightning-combobox>
                    </div>
                </div>
            </div>

            <!-- Filter UI -->
            <template if:true={hasFilterableFields}>
                <div class="slds-box slds-m-bottom_medium slds-theme_default">
                    <div class="slds-text-heading_small slds-m-bottom_medium"><strong>Filter & Fetch Records</strong></div>
                    <template for:each={filterRows} for:item="row">
                        <div key={row.id} class="slds-grid slds-gutters slds-m-bottom_small slds-grid_vertical-align-end">
                            <div class="slds-col slds-size_1-of-4">
                                <lightning-combobox
                                    name="field"
                                    label="Field"
                                    options={filterableFields}
                                    value={row.field}
                                    data-id={row.id}
                                    onchange={handleFilterChange}>
                                </lightning-combobox>
                            </div>
                            <div class="slds-col slds-size_1-of-4">
                                <lightning-combobox
                                    name="operator"
                                    label="Operator"
                                    options={operatorOptions}
                                    value={row.operator}
                                    data-id={row.id}
                                    onchange={handleFilterChange}>
                                </lightning-combobox>
                            </div>
                            <div class="slds-col slds-size_1-of-4">
                                <lightning-input
                                    name="value"
                                    label="Value"
                                    value={row.value}
                                    data-id={row.id}
                                    onchange={handleFilterChange}>
                                </lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-4">
                                <lightning-button-icon
                                    icon-name="utility:delete"
                                    alternative-text="Remove Filter"
                                    variant="bare"
                                    size="large"
                                    class="slds-m-left_small"
                                    data-id={row.id}
                                    onclick={handleRemoveFilter}>
                                </lightning-button-icon>
                            </div>
                        </div>
                    </template>
                    <div class="slds-m-top_small slds-clearfix">
                        <div class="slds-float_left">
                            <lightning-button label="Add Filter" icon-name="utility:add" onclick={handleAddFilter}></lightning-button>
                            <lightning-button label="Clear Filters" variant="neutral" class="slds-m-left_x-small" icon-name="utility:clear" onclick={handleClearFilters}></lightning-button>
                        </div>
                        <div class="slds-float_right">
                            <lightning-button label="Apply Filters & Fetch Records" variant="brand" onclick={handleApplyFilters}></lightning-button>
                        </div>
                    </div>
                </div>
            </template>

            <div class="full-height">
                <template if:true={showRecordTable}>
                    <div class="table-container slds-box slds-p-around_none">
                        <lightning-datatable
                            key-field="Id"
                            data={tableData}
                            sortable="true"
                            onsort={handleSort}
                            sorted-by={sortedBy}
                            sorted-direction={sortDirection}
                            show-row-number-column
                            columns={columns}>
                        </lightning-datatable>
                    </div>
                    <div class="slds-m-top_medium slds-clearfix">
                        <div class="slds-float_right">
                            <lightning-button
                                label="Next"
                                variant="brand"
                                onclick={handleNext}>
                            </lightning-button>
                        </div>
                    </div>
                </template>

                <template if:true={showTemplateSelector}>
                    <div class="slds-box slds-m-top_medium">
                        <div class="slds-text-heading_small slds-m-bottom_medium">Select Template</div>
                        <div class="slds-grid slds-grid_vertical-align-end slds-gutters">
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                                <lightning-record-picker
                                    object-api-name={templateObjectApiName}
                                    label="Template Name"
                                    onchange={handleGetSelectedRecordId}
                                    filter={filter}>
                                </lightning-record-picker>
                            </div>
                            <div class="slds-col slds-grow-none">
                                <lightning-button
                                    label="Send Template"
                                    variant="brand"
                                    class="slds-m-right_small"
                                    onclick={handleSendTemplate}>
                                </lightning-button>
                                <lightning-button
                                    label="View"
                                    variant="neutral"
                                    onclick={handlePreviewTemplate}>
                                </lightning-button>
                            </div>
                        </div>
                    </div>

                    <!-- Modal Content -->
                    <template if:true={isModalOpen}>
                        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01" class="slds-modal slds-fade-in-open">
                            <div class="slds-modal__container">
                                <header class="slds-modal__header">
                                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
                                        <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                                        <span class="slds-assistive-text">Close</span>
                                    </button>
                                    <h2 id="modal-heading-01" class="slds-modal__title slds-hyphenate">Preview Template</h2>
                                </header>
                                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                                    <div class="slds-align_absolute-center">
                                        <div class="slds-box slds-theme_shade" style="background-color: #e5ddd5; width: 400px;">
                                            <section role="log" class="slds-chat">
                                                <ul class="slds-chat-list">
                                                    <li class="slds-chat-listitem slds-chat-listitem_inbound">
                                                        <div class="slds-chat-message">
                                                            <div class="slds-chat-message__body">
                                                                <div class="slds-chat-message__text slds-chat-message__text_inbound" style="background-color: white; border-radius: 7.5px; padding: 8px;">
                                                                    <template if:true={isMediaImage}>
                                                                        <img style="width: 100%; border-radius: 4px; margin-bottom: 8px;" src={objTemplate.publicDocUrl}>
                                                                    </template>
                                                                    <template if:true={isMediaDoc}>
                                                                        <div class="slds-box slds-box_x-small slds-theme_shade slds-m-bottom_small slds-grid slds-grid_vertical-align-center">
                                                                            <lightning-icon icon-name="doctype:attachment" size="medium" class="slds-m-right_small"></lightning-icon>
                                                                            <a href="#">{objTemplate.fileName}</a>
                                                                        </div>
                                                                    </template>
                                                                    <template if:true={isMediaVideo}>
                                                                        <div class="slds-box slds-box_x-small slds-theme_shade slds-m-bottom_small slds-grid slds-grid_vertical-align-center">
                                                                            <lightning-icon icon-name="doctype:mp4" size="medium" class="slds-m-right_small"></lightning-icon>
                                                                            <a href="#">{objTemplate.fileName}</a>
                                                                        </div>
                                                                    </template>
                                                                    <div class="slds-text-body_regular">
                                                                        <lightning-formatted-rich-text value={templateViewBody}></lightning-formatted-rich-text>
                                                                    </div>
                                                                </div>

                                                                <!-- Action Buttons inside chat -->
                                                                <div class="slds-m-top_x-small">
                                                                    <template for:each={previewActionButtons} for:item="objMap">
                                                                        <template if:true={isQuickReplyList}>
                                                                            <div key={objMap.buttonText} class="slds-box slds-box_x-small slds-m-top_xx-small slds-text-align_center" style="background-color: white; color: #00a884; cursor: pointer;">
                                                                                {objMap.buttonText}
                                                                            </div>
                                                                        </template>
                                                                        <template if:true={isActionList}>
                                                                            <div key={objMap.buttonText} class="slds-box slds-box_x-small slds-m-top_xx-small slds-grid slds-grid_vertical-align-center slds-grid_align-center" style="background-color: white; color: #00a884; cursor: pointer;">
                                                                                <template if:true={objMap.isIcon}>
                                                                                    <lightning-icon icon-name={objMap.iconName} size="x-small" class="slds-m-right_x-small"></lightning-icon>
                                                                                </template>
                                                                                <span>{objMap.buttonText}</span>
                                                                            </div>
                                                                        </template>
                                                                    </template>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </li>
                                                </ul>
                                            </section>
                                        </div>
                                    </div>
                                </div>
                                <footer class="slds-modal__footer">
                                    <button class="slds-button slds-button_neutral" onclick={closeModal}>Close</button>
                                </footer>
                            </div>
                        </section>
                        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
                    </template>
                </template>
            </div>
        </div>
    </div>

    <template if:true={isLoading}>
        <lightning-spinner alternative-text="Loading" size="large" variant="brand"></lightning-spinner>
    </template>
</template>
